name: Extract Daria vendor libs
on: [workflow_dispatch]

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
    - name: Free up disk
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        df -h /

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq unzip python3-pip erofs-utils android-sdk-libsparse-utils
        # payload-dumper-go for A/B payload.bin
        curl -sL -o /tmp/pd.tar.gz https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
        tar xzf /tmp/pd.tar.gz -C /tmp
        sudo mv /tmp/payload-dumper-go /usr/local/bin/ || true
        chmod +x /usr/local/bin/payload-dumper-go || true
        payload-dumper-go -h 2>&1 | head -3 || true

    - name: Download ROM
      run: |
        URL="https://api.dariaos.com/ota/download/DariaOS-6.0-20250922-RELEASE-zahedan-V6.7.2.0.BOND-user-signed.zip"
        echo "Downloading ROM..."
        curl -sL --retry 3 -o rom.zip "$URL"
        ls -lh rom.zip
        echo "=== ZIP top-level contents ==="
        unzip -l rom.zip | head -40

    - name: Extract vendor image
      run: |
        set -e
        # Case A: payload.bin (A/B OTA)
        if unzip -l rom.zip | grep -q 'payload.bin'; then
          echo "Found payload.bin -> extracting vendor partition"
          unzip -o rom.zip payload.bin
          payload-dumper-go -p vendor payload.bin || payload-dumper-go payload.bin
          find . -name 'vendor.img' -o -name 'vendor_*.img' | head
        else
          echo "No payload.bin; looking for super.img / vendor.img directly"
          unzip -o rom.zip '*vendor*.img' '*super*.img' 2>/dev/null || true
          ls -lh *.img 2>/dev/null || true
        fi
        # If we only got super.img, split it
        if [ -f super.img ] && [ ! -f vendor.img ] && [ ! -f extracted/vendor.img ]; then
          echo "Splitting super.img with lpunpack"
          sudo apt-get install -y -qq android-tools-fsutils || true
          which lpunpack && lpunpack super.img ./ || true
        fi

    - name: Locate + mount/extract vendor
      run: |
        set -e
        VIMG=$(find . -name 'vendor.img' | head -1)
        echo "vendor.img at: $VIMG"
        ls -lh "$VIMG"
        mkdir -p out/lib64/hw out/etc
        # try mounting (ext4) first
        mkdir -p mnt
        if sudo mount -o ro "$VIMG" mnt 2>/dev/null; then
          echo "mounted ext4"; SRC=mnt
        else
          echo "mount failed, trying erofs fuse / dump.erofs"
          if command -v fsck.erofs >/dev/null; then
            mkdir -p erofs_out
            dump.erofs "$VIMG" 2>/dev/null | head || true
            # extract everything with fsck.erofs --extract
            fsck.erofs --extract=erofs_out "$VIMG" || true
            SRC=erofs_out
          fi
        fi
        echo "SRC=$SRC"
        # copy the target files (search widely because layout varies)
        for f in libcameracustom.flashlight.so \
                 libmtkcam_metastore.so \
                 libmtkcam_metadata.so \
                 lib3a.flash.so ; do
          found=$(find "$SRC" -name "$f" 2>/dev/null | head -1)
          [ -n "$found" ] && cp "$found" out/lib64/ && echo "copied $f"
        done
        prov=$(find "$SRC" -name 'android.hardware.camera.provider@2.6-impl-mediatek.so' 2>/dev/null | head -1)
        [ -n "$prov" ] && cp "$prov" out/lib64/hw/ && echo "copied provider impl"
        # copy vendor/etc camera/flash configs (small)
        find "$SRC" -path '*etc*' \( -iname '*camera*' -o -iname '*flash*' \) -type f 2>/dev/null | while read p; do
          rel=${p#*etc/}
          mkdir -p "out/etc/$(dirname "$rel")"
          cp "$p" "out/etc/$rel" 2>/dev/null || true
        done
        echo "=== collected files ==="
        find out -type f -printf '%s\t%p\n' | sort -nr
        du -sh out

    - name: Upload extracted libs
      uses: actions/upload-artifact@v4
      with:
        name: daria-vendor-libs
        path: out/**
